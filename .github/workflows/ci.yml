name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick a booted-able iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build
        run: xcodebuild build -scheme StaminaKit -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath /tmp/dd | xcpretty || xcodebuild build -scheme StaminaKit -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath /tmp/dd
      - name: Unit tests (conformance scenarios skip without the mock server)
        run: xcodebuild test -scheme StaminaKit -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath /tmp/dd 2>&1 | tail -30
      - name: Podspec lint
        run: pod lib lint StaminaKit.podspec --allow-warnings --skip-tests
